
name: Build NOUR OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Configure NOUR OS
        run: |
          mkdir nour-build
          cd nour-build
          sudo lb config \
            --distribution trixie \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware"

      - name: Add desktop packages
        working-directory: nour-build
        run: |
          sudo mkdir -p config/package-lists
          printf '%s\n' task-xfce-desktop firefox-esr network-manager | sudo tee config/package-lists/nour.list.chroot

      - name: Build Linux ISO
        working-directory: nour-build
        run: sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nour-os-iso
          path: nour-build/*.iso
          if-no-files-found: error
          retention-days: 3
