
name: Build NOUR OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common grub-pc-bin \
            grub-efi-amd64-bin mtools dosfstools

      - name: Configure Debian Live
        run: |
          mkdir nour-build
          cd nour-build
          sudo lb config \
            --distribution trixie \
            --archive-areas "main contrib non-free-firmware" \
            --binary-images iso-hybrid \
            --bootappend-live "boot=live components quiet splash"

      - name: Select desktop and applications
        working-directory: nour-build
        run: |
          sudo mkdir -p config/package-lists
          sudo tee config/package-lists/nour.list.chroot > /dev/null <<'EOF'
          live-boot
          live-config
          task-xfce-desktop
          firefox-esr
          network-manager
          sudo
          curl
          git
          EOF

      - name: Build NOUR OS ISO
        working-directory: nour-build
        run: |
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nour-os-iso
          path: nour-build/*.iso
          if-no-files-found: error
          retention-days: 3
