
name: Build NOUR OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debian Live Prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Configure Debian Live
        run: |
          mkdir -p "$GITHUB_WORKSPACE/nour-build"
          cd "$GITHUB_WORKSPACE/nour-build"

          sudo lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --debian-installer none \
            --bootappend-live "boot=live components quiet splash"

      - name: Configure NOUR desktop packages
        run: |
          cd "$GITHUB_WORKSPACE/nour-build"
          sudo mkdir -p config/package-lists

          sudo tee config/package-lists/nour.list.chroot > /dev/null <<'EOF'
          task-xfce-desktop
          firefox-esr
          network-manager
          sudo
          curl
          git
          live-boot
          live-config
          EOF

      - name: Build NOUR OS ISO
        run: |
          cd "$GITHUB_WORKSPACE/nour-build"
          sudo lb build

      - name: Check ISO output
        run: |
          find "$GITHUB_WORKSPACE/nour-build" \
            -maxdepth 1 -type f -name '*.iso' -ls
          test -n "$(find "$GITHUB_WORKSPACE/nour-build" \
            -maxdepth 1 -type f -name '*.iso' -print -quit)"

      - name: Upload NOUR OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: nour-os-iso
          path: nour-build/*.iso
          if-no-files-found: error
          retention-days: 3
